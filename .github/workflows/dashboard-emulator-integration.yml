name: DOJO WALK Admin Dashboard Firestore Emulator Integration

on:
  pull_request:
    paths:
      - "lib/screens/dashboard/**"
      - "lib/screens/bookings/booking_status_helper.dart"
      - "integration_test/dashboard_data_source_emulator_test.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/dashboard-emulator-integration.yml"
  push:
    branches:
      - "ui/**"
    paths:
      - "lib/screens/dashboard/**"
      - "lib/screens/bookings/booking_status_helper.dart"
      - "integration_test/dashboard_data_source_emulator_test.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/dashboard-emulator-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard-firestore-emulator:
    name: Dashboard data source against canonical Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Admin
        uses: actions/checkout@v5

      - name: Checkout pinned Firebase Rules and indexes
        uses: actions/checkout@v5
        with:
          repository: DOJOWALK/DOJO-WALK-Firebase
          ref: 42923ecabedb60c158cdec91a5397f9925b3e07a
          path: firebase-rules

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate CI-only Android runner scaffold
        run: |
          flutter create --platforms=android --project-name dojo_admin .
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if "<application" not in content:
              raise SystemExit("Generated Android application tag not found")
          if "android:usesCleartextTraffic=" not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          xml = Path("android/app/src/main/res/xml")
          xml.mkdir(parents=True, exist_ok=True)
          (xml / "network_security_config.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          """)
          if "android:networkSecurityConfig=" not in content:
              content = content.replace(
                  "<application",
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
          manifest.write_text(content)
          PY

      - name: Install Firebase emulator dependencies
        working-directory: firebase-rules
        run: npm install --no-audit --no-fund

      - name: Start Auth and Firestore emulators
        working-directory: firebase-rules
        run: |
          npx firebase emulators:start --only auth,firestore --project demo-dojo-dashboard-integration > "$RUNNER_TEMP/dashboard-emulators.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dashboard-emulators.pid"
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9099) >/dev/null 2>&1 && (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then
              echo "Auth and Firestore Emulator ports are accepting connections."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dashboard-emulators.log"
          exit 1

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Dashboard Firestore Emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            timeout 15m flutter test integration_test/dashboard_data_source_emulator_test.dart -d emulator-5554 --dart-define=DOJO_DASHBOARD_EMULATOR_PROJECT_ID=demo-dojo-dashboard-integration

      - name: Show Emulator logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/dashboard-emulators.log"

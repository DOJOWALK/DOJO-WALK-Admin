name: DOJO WALK Admin Flutter Validation

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-validation.yml"
  push:
    branches:
      - "ui/**"
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build Flutter Web
        run: flutter build web --release --no-pub

name: Admin Main Full Validation (No Deploy)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Analyze, test and build Admin Web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze complete Admin project
        run: flutter analyze

      - name: Run complete Admin test suite
        run: flutter test

      - name: Build Flutter Web (no deployment)
        run: flutter build web --release

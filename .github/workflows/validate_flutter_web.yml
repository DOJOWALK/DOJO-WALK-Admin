name: DOJO WALK Flutter Web Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "restore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web (no deployment)
        run: flutter build web --release
